<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bids Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .card {
            border-radius: 10px;
        }
        .status-pending {
            color: orange;
            font-weight: bold;
        }
        .status-rejected {
            color: red;
            font-weight: bold;
        }
        .status-accepted {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">TMS Dashboard</a>
        <div>
            <a href="/ui/bids" class="btn btn-outline-light btn-sm">Bids</a>
            <a href="/ui/loads" class="btn btn-outline-light btn-sm">Loads</a>
            <a href="/ui/transporters" class="btn btn-outline-light btn-sm">Transporters</a>
        </div>
    </div>
</nav>

<div class="container">

    <!-- TITLE -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>All Bids</h2>
    </div>

    <!-- FILTER -->
    <form method="get" action="/ui/bids" class="row g-3 mb-4">
        <div class="col-md-3">
            <input type="number" name="loadId" class="form-control" placeholder="Load ID">
        </div>
        <div class="col-md-3">
            <input type="number" name="transporterId" class="form-control" placeholder="Transporter ID">
        </div>
        <div class="col-md-3">
            <select name="status" class="form-control">
                <option value="">All Status</option>
                <option value="PENDING">Pending</option>
                <option value="REJECTED">Rejected</option>
                <option value="ACCEPTED">Accepted</option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100">Filter</button>
        </div>
    </form>

    <!-- TABLE CARD -->
    <div class="card shadow p-3">

        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Load</th>
                    <th>Transporter</th>
                    <th>Rate</th>
                    <th>Trucks</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="bid : ${bids}">
                    <td th:text="${bid.bidId}"></td>
                    <td th:text="${bid.loadId}"></td>
                    <td th:text="${bid.transporterCompanyName}"></td>
                    <td>₹ <span th:text="${bid.proposedRate}"></span></td>
                    <td th:text="${bid.trucksOffered}"></td>

                    <!-- STATUS STYLE -->
                    <td>
                        <span th:text="${bid.status}"
                              th:classappend="
                                ${bid.status}=='PENDING' ? 'status-pending' :
                                (${bid.status}=='REJECTED' ? 'status-rejected' : 'status-accepted')
                              ">
                        </span>
                    </td>

                    <!-- ACTION -->
                    <td>
                        <form th:action="@{'/bid/' + ${bid.bidId} + '/reject'}" method="post">
                            <input type="hidden" name="_method" value="patch"/>
                            <button class="btn btn-danger btn-sm"
                                    th:if="${bid.status == 'PENDING'}">
                                Reject
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
