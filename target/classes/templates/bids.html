<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bids Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #eef2f7, #f8fafc);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .table thead {
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .table tbody tr {
            transition: all 0.2s ease;
        }

        .table tbody tr:hover {
            background-color: #f1f5f9;
            transform: scale(1.01);
        }

        .badge-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .accepted {
            background-color: #d4edda;
            color: #155724;
        }

        .rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .filter-card {
            border-radius: 12px;
            background: #ffffff;
            padding: 15px;
        }

        .btn-sm {
            border-radius: 20px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#">🚚 TMS Dashboard</a>

        <div>
            <a href="/ui/bids" class="btn btn-outline-light btn-sm me-2">Bids</a>
            <a href="/ui/loads" class="btn btn-outline-light btn-sm me-2">Loads</a>
            <a href="/ui/transporters" class="btn btn-outline-light btn-sm">Transporters</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold">📊 Bids Overview</h3>
        <span class="text-muted">Manage and track all bids efficiently</span>
    </div>

    <!-- FILTER CARD -->
    <div class="filter-card shadow-sm mb-4">
        <form method="get" action="/ui/bids" class="row g-3">
            <div class="col-md-3">
                <input type="number" name="loadId" class="form-control" placeholder="Load ID">
            </div>
            <div class="col-md-3">
                <input type="number" name="transporterId" class="form-control" placeholder="Transporter ID">
            </div>
            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="">All Status</option>
                    <option value="PENDING">Pending</option>
                    <option value="REJECTED">Rejected</option>
                    <option value="ACCEPTED">Accepted</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100">Apply Filters</button>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm p-3">
        <table class="table align-middle">
            <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>Load</th>
                    <th>Transporter</th>
                    <th>Rate</th>
                    <th>Trucks</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody class="text-center">
                <tr th:each="bid : ${bids}">
                    <td th:text="${bid.bidId}"></td>
                    <td th:text="${bid.loadId}"></td>
                    <td class="fw-semibold" th:text="${bid.transporterCompanyName}"></td>

                    <td>
                        <span class="fw-bold text-success">
                            ₹ <span th:text="${bid.proposedRate}"></span>
                        </span>
                    </td>

                    <td th:text="${bid.trucksOffered}"></td>

                    <!-- STATUS -->
                    <td>
                        <span th:text="${bid.status}"
                              th:classappend="
                                ${bid.status}=='PENDING' ? 'badge-status pending' :
                                (${bid.status}=='REJECTED' ? 'badge-status rejected' : 'badge-status accepted')
                              ">
                        </span>
                    </td>

                    <!-- ACTION -->
                    <td>
                        <form th:action="@{'/bid/' + ${bid.bidId} + '/reject'}" method="post">
                            <input type="hidden" name="_method" value="patch"/>
                            
                            <button class="btn btn-outline-danger btn-sm px-3"
                                    th:if="${bid.status == 'PENDING'}">
                                Reject
                            </button>

                            <span class="text-muted small"
                                  th:if="${bid.status != 'PENDING'}">
                                No Action
                            </span>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
